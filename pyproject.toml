[project]
name = "hotelpilot"
version = "0.3.0"
description = "Headless AI agent: Bali hotel data -> bilingual blog articles -> Threads every 2 hours"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "tenacity>=9.0",
  "structlog>=24.1",
  "apscheduler>=3.10,<4",
  "jinja2>=3.1",
  "markdown>=3.6",
  "cryptography>=43",
  "pyjwt>=2.9",
  "rapidfuzz>=3.9",
  "duckdb>=1.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hotelpilot"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008", "ASYNC230", "ASYNC240"]  # small local cache files; sync I/O is fine

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
packages = ["hotelpilot"]
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
